name: Run Trading Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Wine and Virtual Display
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y wine64 wine32 xvfb winetricks

    - name: Setup Portable MT5 & Python
      run: |
        # Download portable MT5
        wget https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe
        export WINEPREFIX=~/.wine
        # Install MT5 silently (no GUI)
        xvfb-run wine mt5setup.exe /auto
        # Install Python
        wget https://www.python.org/ftp/python/3.10.0/python-3.10.0-amd64.exe
        xvfb-run wine python-3.10.0-amd64.exe /quiet InstallAllUsers=1 PrependPath=1
        # Install required Windows libraries
        xvfb-run winetricks -q vcrun2019
        # Install Python libraries
        wine python -m pip install MetaTrader5 pandas numpy

    - name: Run Bot
      run: |
        export WINEPREFIX=~/.wine
        # Start MT5 in background and run bot
        xvfb-run wine "C:\\Program Files\\MetaTrader 5\\terminal64.exe" /portable &
        sleep 10
        xvfb-run wine python trend_autotrade.py
